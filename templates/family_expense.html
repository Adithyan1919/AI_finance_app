{% extends "base.html" %}
{% block content %}
<!-- family_expense.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Expenses</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                        <h3 class="mb-0">Family Expense Tracker</h3>
                        <a href="{{ url_for('view_family_expenses') }}" class="btn btn-light">View All Expenses</a>
                    </div>
                    <div class="card-body">
                        <form id="expenseForm">
                            <div class="mb-3">
                                <label for="familyMember" class="form-label">Family Member</label>
                                <select class="form-select" id="familyMember" required>
                                    <option value="">Select Family Member</option>
                                    {% for member in family_members %}
                                    <option value="{{ member.id }}">{{ member.name }} ({{ member.relation }})</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="category" class="form-label">Category</label>
                                <select class="form-select" id="category" required>
                                    <option value="">Select Category</option>
                                    <option value="Food">Food</option>
                                    <option value="Transportation">Transportation</option>
                                    <option value="Entertainment">Entertainment</option>
                                    <option value="Education">Education</option>
                                    <option value="Healthcare">Healthcare</option>
                                    <option value="Clothing">Clothing</option>
                                    <option value="Utilities">Utilities</option>
                                    <option value="Other">Other</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="amount" class="form-label">Amount</label>
                                <div class="input-group">
                                    <span class="input-group-text">₹</span>
                                    <input type="number" class="form-control" id="amount" step="0.01" required>
                                </div>
                            </div>
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary btn-lg">Save Expense</button>
                            </div>
                        </form>
                    </div>
                </div>
                <div class="mt-3">
                    <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">Back to Dashboard</a>
                </div>
            </div>
        </div>
    </div>

    <script>
       document.getElementById('expenseForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const memberSelect = document.getElementById('familyMember');
        const memberName = memberSelect.options[memberSelect.selectedIndex].text.split(' (')[0]; // Extract name only
        const mainCategory = document.getElementById('category').value;
        const amount = parseFloat(document.getElementById('amount').value);

        if (!memberName || !mainCategory || isNaN(amount)) {
            alert('Please fill all fields correctly');
            return;
        }

        fetch('/save_family_expense', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({
                memberName: memberName,
                mainCategory: mainCategory,
                subCategory: "General", // optional, adjust if needed
                amount: amount
            }),
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                alert('Expense saved successfully!');
                document.getElementById('expenseForm').reset();
            } else {
                alert(data.message || 'Failed to save expense');
            }
        })
        .catch(error => {
            console.error('Error:', error);
            alert('An error occurred while saving expense');
        });
    });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
{% endblock %}
