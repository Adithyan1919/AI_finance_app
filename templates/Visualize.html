<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Visualization</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; }
        canvas { max-width: 600px; margin: 20px auto; }
    </style>
</head>
<body>

    <h2>Expense Breakdown</h2>
    <canvas id="expenseChart"></canvas>

    <h2>Budget vs Actual Expenses</h2>
    <canvas id="budgetComparisonChart"></canvas>

    <script>
        async function fetchData(url) {
            try {
                const response = await fetch(url);
                return response.ok ? response.json() : [];
            } catch (error) {
                console.error('Error fetching data:', error);
                return [];
            }
        }

        async function updateCharts() {
            const expenses = await fetchData('/get-expenses');
            const budgets = await fetchData('/budget-data');

            const ctx = document.getElementById('expenseChart').getContext('2d');
            if (window.expenseChart) window.expenseChart.destroy();

            const categories = [...new Set(expenses.map(e => e.category))];
            const amounts = categories.map(cat => 
                expenses.filter(e => e.category === cat).reduce((sum, e) => sum + e.amount, 0)
            );

            window.expenseChart = new Chart(ctx, {
                type: 'pie',
                data: {
                    labels: categories,
                    datasets: [{
                        data: amounts,
                        backgroundColor: ['#ff6384', '#36a2eb', '#ffce56', '#4bc0c0', '#9966ff', '#ff9f40']
                    }]
                },
                options: { responsive: true }
            });

            const ctx2 = document.getElementById('budgetComparisonChart').getContext('2d');
            if (window.budgetChart) window.budgetChart.destroy();

            const plannedBudget = {};
            budgets.forEach(b => { plannedBudget[b.category] = b.amount; });

            const planned = categories.map(cat => plannedBudget[cat] || 0);
            const actual = categories.map(cat => amounts[categories.indexOf(cat)] || 0);

            window.budgetChart = new Chart(ctx2, {
                type: 'bar',
                data: {
                    labels: categories,
                    datasets: [
                        { label: 'Planned', data: planned, backgroundColor: 'blue' },
                        { label: 'Actual', data: actual, backgroundColor: 'red' }
                    ]
                },
                options: {
                    responsive: true,
                    scales: { y: { beginAtZero: true } }
                }
            });
        }

        updateCharts();
    </script>

</body>
</html>
