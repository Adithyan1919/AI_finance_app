<!-- family_details.html -->
{% extends "base.html" %}
{% block content %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Details</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h3 class="mb-0">Family Member Details</h3>
                    </div>
                    <div class="card-body">
                        <form action="{{ url_for('family_details') }}" method="post">
                            <input type="hidden" name="family_member_count" value="{{ count }}">
                            
                            {% for i in range(1, count + 1) %}
                            <div class="card mb-4">
                                <div class="card-header bg-light">
                                    <h4>Family Member {{ i }}</h4>
                                </div>
                                <div class="card-body">
                                    <div class="mb-3">
                                        <label for="name_{{ i }}" class="form-label">Name</label>
                                        <input type="text" class="form-control" id="name_{{ i }}" name="name_{{ i }}" required>
                                    </div>
                                    <div class="mb-3">
                                        <label for="age_{{ i }}" class="form-label">Age</label>
                                        <input type="number" class="form-control" id="age_{{ i }}" name="age_{{ i }}" required>
                                    </div>
                                    <div class="mb-3">
                                        <label for="income_{{ i }}" class="form-label">Annual Income</label>
                                        <input type="number" class="form-control" id="income_{{ i }}" name="income_{{ i }}" step="0.01" required>
                                    </div>
                                    <div class="mb-3">
                                        <label for="relation_{{ i }}" class="form-label">Relation</label>
                                        <select class="form-select" id="relation_{{ i }}" name="relation_{{ i }}" required>
                                            <option value="">Select Relation</option>
                                            <option value="spouse">Spouse</option>
                                            <option value="child">Child</option>
                                            <option value="parent">Parent</option>
                                            <option value="sibling">Sibling</option>
                                            <option value="other">Other</option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                            {% endfor %}
                            
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary btn-lg">Save Family Details</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
{% endblock %}
